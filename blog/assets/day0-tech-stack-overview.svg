<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
    <linearGradient id="titleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B5BDB"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="900" fill="#F8FAFC"/>

  <!-- 标题区 -->
  <rect x="40" y="18" width="1200" height="56" rx="10" fill="url(#titleBar)"/>
  <text x="640" y="44" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">劳小司 · 智能法律助手 —— 技术栈全景</text>
  <text x="640" y="65" text-anchor="middle" font-size="12.5" fill="#DBEAFE">JDK 17 + Spring Boot 3.5.11 + Spring AI 1.1.7 · 单模块 lab-chat-backend 渐进演进 · 全链路降级</text>

  <!-- ═══════════ L1 前端层 ═══════════ -->
  <rect x="40" y="90" width="1200" height="96" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="60" y="118" font-size="15" font-weight="bold" fill="#4338CA">前端层</text>
  <text x="60" y="140" font-size="10.5" fill="#6366F1">Vue3 + Element Plus</text>
  <text x="60" y="156" font-size="10.5" fill="#6366F1">Pinia + Vite</text>

  <g font-size="12.5">
    <rect x="190" y="104" width="196" height="68" rx="7" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="288" y="130" text-anchor="middle" font-weight="bold" fill="#1E293B">公报问答台 UI</text>
    <text x="288" y="150" text-anchor="middle" font-size="10.5" fill="#64748B">V9 报刊式视觉体系</text>

    <rect x="398" y="104" width="196" height="68" rx="7" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="496" y="130" text-anchor="middle" font-weight="bold" fill="#1E293B">SSE 流式渲染</text>
    <text x="496" y="150" text-anchor="middle" font-size="10.5" fill="#64748B">逐 token 显示 + 滚动锚定</text>

    <rect x="606" y="104" width="196" height="68" rx="7" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="704" y="130" text-anchor="middle" font-weight="bold" fill="#1E293B">思考过程面板</text>
    <text x="704" y="150" text-anchor="middle" font-size="10.5" fill="#64748B">reasoning_content 透传</text>

    <rect x="814" y="104" width="196" height="68" rx="7" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="912" y="130" text-anchor="middle" font-weight="bold" fill="#1E293B">引用卡片</text>
    <text x="912" y="150" text-anchor="middle" font-size="10.5" fill="#64748B">法名 · 条号 · 相关度分</text>

    <rect x="1022" y="104" width="196" height="68" rx="7" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="1120" y="130" text-anchor="middle" font-weight="bold" fill="#1E293B">移动端适配</text>
    <text x="1120" y="150" text-anchor="middle" font-size="10.5" fill="#64748B">响应式布局 · 局域网真机可测</text>
  </g>

  <line x1="640" y1="186" x2="640" y2="200" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ═══════════ L2 接入层 ═══════════ -->
  <rect x="40" y="200" width="1200" height="88" rx="10" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
  <text x="60" y="230" font-size="15" font-weight="bold" fill="#0E7490">接入层</text>
  <text x="60" y="252" font-size="10.5" fill="#0891B2">nginx + SSE</text>
  <text x="60" y="268" font-size="10.5" fill="#0891B2">REST API</text>

  <g font-size="12.5">
    <rect x="190" y="214" width="336" height="60" rx="7" fill="#FFFFFF" stroke="#A5F3FC"/>
    <text x="358" y="238" text-anchor="middle" font-weight="bold" fill="#1E293B">nginx 反向代理</text>
    <text x="358" y="258" text-anchor="middle" font-size="10.5" fill="#64748B">静态资源托管 + API 前缀白名单</text>

    <rect x="538" y="214" width="336" height="60" rx="7" fill="#FFFFFF" stroke="#A5F3FC"/>
    <text x="706" y="238" text-anchor="middle" font-weight="bold" fill="#1E293B">SSE 流式通道</text>
    <text x="706" y="258" text-anchor="middle" font-size="10.5" fill="#64748B">text/event-stream · 七类结构化事件</text>

    <rect x="886" y="214" width="332" height="60" rx="7" fill="#FFFFFF" stroke="#A5F3FC"/>
    <text x="1052" y="238" text-anchor="middle" font-weight="bold" fill="#1E293B">REST API</text>
    <text x="1052" y="258" text-anchor="middle" font-size="10.5" fill="#64748B">认证 · 会话 · 工具 · 法条库 · 管理端</text>
  </g>

  <line x1="640" y1="288" x2="640" y2="302" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ═══════════ L3 应用层 ═══════════ -->
  <rect x="40" y="302" width="1200" height="150" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="60" y="332" font-size="15" font-weight="bold" fill="#1D4ED8">应用层</text>
  <text x="60" y="354" font-size="10.5" fill="#3B82F6">Spring Boot 3.5.11</text>
  <text x="60" y="370" font-size="10.5" fill="#3B82F6">Servlet 栈承载</text>
  <text x="60" y="386" font-size="10.5" fill="#3B82F6">WebFlux SSE</text>

  <g font-size="12">
    <rect x="190" y="316" width="336" height="56" rx="7" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="358" y="338" text-anchor="middle" font-weight="bold" fill="#1E293B">ChatService 流式编排</text>
    <text x="358" y="357" text-anchor="middle" font-size="10.5" fill="#64748B">Sinks + takeUntilOther 停止生成</text>

    <rect x="538" y="316" width="336" height="56" rx="7" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="706" y="338" text-anchor="middle" font-weight="bold" fill="#1E293B">会话记忆（两级压缩）</text>
    <text x="706" y="357" text-anchor="middle" font-size="10.5" fill="#64748B">原文窗口 + 早期摘要</text>

    <rect x="886" y="316" width="332" height="56" rx="7" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="1052" y="338" text-anchor="middle" font-weight="bold" fill="#1E293B">认证与授权</text>
    <text x="1052" y="357" text-anchor="middle" font-size="10.5" fill="#64748B">JWT 无状态 + RBAC 五角色 + 短信验证码</text>

    <rect x="190" y="382" width="336" height="56" rx="7" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="358" y="404" text-anchor="middle" font-weight="bold" fill="#1E293B">分层配额治理</text>
    <text x="358" y="423" text-anchor="middle" font-size="10.5" fill="#64748B">五档速率 + 日配额（Redis 原子计数）</text>

    <rect x="538" y="382" width="336" height="56" rx="7" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="706" y="404" text-anchor="middle" font-weight="bold" fill="#1E293B">SafetyGuard 确定性安全层</text>
    <text x="706" y="423" text-anchor="middle" font-size="10.5" fill="#64748B">纯规则引擎（零 LLM）：拒答 / 紧急置顶 / 免责声明</text>

    <rect x="886" y="382" width="332" height="56" rx="7" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="1052" y="404" text-anchor="middle" font-weight="bold" fill="#1E293B">质量门审校</text>
    <text x="1052" y="423" text-anchor="middle" font-size="10.5" fill="#64748B">规则校验引用与长度 → SSE retry 重试一轮</text>
  </g>

  <line x1="640" y1="452" x2="640" y2="466" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ═══════════ L4 AI 能力层 ═══════════ -->
  <rect x="40" y="466" width="1200" height="150" rx="10" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="60" y="496" font-size="15" font-weight="bold" fill="#C2410C">AI 能力层</text>
  <text x="60" y="518" font-size="10.5" fill="#EA580C">Spring AI 1.1.7</text>
  <text x="60" y="534" font-size="10.5" fill="#EA580C">统一抽象：</text>
  <text x="60" y="550" font-size="10.5" fill="#EA580C">ChatClient / ChatMemory</text>
  <text x="60" y="566" font-size="10.5" fill="#EA580C">VectorStore / Tool</text>

  <g font-size="12">
    <rect x="190" y="480" width="336" height="56" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
    <text x="358" y="502" text-anchor="middle" font-weight="bold" fill="#1E293B">五路模型端点</text>
    <text x="358" y="521" text-anchor="middle" font-size="10.5" fill="#64748B">default · reasoning · cheap · legal · fallback</text>

    <rect x="538" y="480" width="336" height="56" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
    <text x="706" y="502" text-anchor="middle" font-weight="bold" fill="#1E293B">三级级联路由</text>
    <text x="706" y="521" text-anchor="middle" font-size="10.5" fill="#64748B">关键词硬规则 → 语义快筛 → LLM 分类兜底</text>

    <rect x="886" y="480" width="332" height="56" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
    <text x="1052" y="502" text-anchor="middle" font-weight="bold" fill="#1E293B">Function Calling 工具集</text>
    <text x="1052" y="521" text-anchor="middle" font-size="10.5" fill="#64748B">法律计算器 · 联网搜索 · 法条检索 · 预算治理</text>

    <rect x="190" y="546" width="336" height="56" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
    <text x="358" y="568" text-anchor="middle" font-weight="bold" fill="#1E293B">RAG 五阶段检索管线</text>
    <text x="358" y="587" text-anchor="middle" font-size="10.5" fill="#64748B">稠密召回 + BM25 稀疏 + RRF + 精排 + 整条还原</text>

    <rect x="538" y="546" width="336" height="56" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
    <text x="706" y="568" text-anchor="middle" font-weight="bold" fill="#1E293B">可插拔存储抽象</text>
    <text x="706" y="587" text-anchor="middle" font-size="10.5" fill="#64748B">ChatMemory + VectorStore 接口，换库不动业务</text>

    <rect x="886" y="546" width="332" height="56" rx="7" fill="#FFFFFF" stroke="#FED7AA"/>
    <text x="1052" y="568" text-anchor="middle" font-weight="bold" fill="#1E293B">PlannerAgent 规划器</text>
    <text x="1052" y="587" text-anchor="middle" font-size="10.5" fill="#64748B">廉价模型改写多轮指代（"那家公司"→实体）</text>
  </g>

  <line x1="640" y1="616" x2="640" y2="630" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ═══════════ L5 模型服务 ═══════════ -->
  <rect x="40" y="630" width="1200" height="88" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="60" y="660" font-size="15" font-weight="bold" fill="#6D28D9">模型服务</text>
  <text x="60" y="682" font-size="10.5" fill="#8B5CF6">外部 API</text>
  <text x="60" y="698" font-size="10.5" fill="#8B5CF6">配置驱动接入</text>

  <g font-size="12.5">
    <rect x="190" y="644" width="500" height="60" rx="7" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text x="440" y="668" text-anchor="middle" font-weight="bold" fill="#1E293B">DeepSeek（OpenAI 兼容协议）</text>
    <text x="440" y="688" text-anchor="middle" font-size="10.5" fill="#64748B">对话 / 推理 / 联网子模型 · 五路端点只改 yml</text>

    <rect x="702" y="644" width="516" height="60" rx="7" fill="#FFFFFF" stroke="#DDD6FE"/>
    <text x="960" y="668" text-anchor="middle" font-weight="bold" fill="#1E293B">阿里云百炼 DashScope</text>
    <text x="960" y="688" text-anchor="middle" font-size="10.5" fill="#64748B">text-embedding（1024 维）+ gte-rerank-v2 Cross-Encoder 精排</text>
  </g>

  <line x1="640" y1="718" x2="640" y2="732" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ═══════════ L6 存储层 ═══════════ -->
  <rect x="40" y="732" width="1200" height="110" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="60" y="766" font-size="15" font-weight="bold" fill="#047857">存储层</text>
  <text x="60" y="788" font-size="10.5" fill="#059669">可插拔组合</text>
  <text x="60" y="804" font-size="10.5" fill="#059669">（详见存储选型图）</text>

  <g font-size="12">
    <rect x="190" y="748" width="400" height="78" rx="7" fill="#FFFFFF" stroke="#A7F3D0"/>
    <text x="390" y="772" text-anchor="middle" font-weight="bold" fill="#1E293B">PostgreSQL 18 + pgvector（HNSW）</text>
    <text x="390" y="792" text-anchor="middle" font-size="10.5" fill="#64748B">law_article 底账（唯一事实源）· vector_store 向量索引</text>
    <text x="390" y="809" text-anchor="middle" font-size="10.5" fill="#64748B">chat_session / chat_message / chat_summary 会话记忆 · MyBatis</text>

    <rect x="602" y="748" width="280" height="78" rx="7" fill="#FFFFFF" stroke="#A7F3D0"/>
    <text x="742" y="772" text-anchor="middle" font-weight="bold" fill="#1E293B">pg_trgm GIN 索引</text>
    <text x="742" y="792" text-anchor="middle" font-size="10.5" fill="#64748B">稀疏检索路：补"第四十七条"</text>
    <text x="742" y="809" text-anchor="middle" font-size="10.5" fill="#64748B">类离散编号的精确匹配</text>

    <rect x="894" y="748" width="324" height="78" rx="7" fill="#FFFFFF" stroke="#A7F3D0"/>
    <text x="1056" y="772" text-anchor="middle" font-weight="bold" fill="#1E293B">Redis + Redisson 3.50</text>
    <text x="1056" y="792" text-anchor="middle" font-size="10.5" fill="#64748B">配额计数 · 分布式锁 · 验证码桶</text>
    <text x="1056" y="809" text-anchor="middle" font-size="10.5" fill="#64748B">停止信号 / 同步进度等易失态（纯缓存定位）</text>
  </g>

  <!-- 底部注释 -->
  <text x="640" y="872" text-anchor="middle" font-size="11.5" fill="#64748B">部署：Docker Compose + nginx（配置全部环境变量化）· 评估门禁：离线金标集 mvn test 一票否决 · 成本意识：路由三级级联能省则省，闲聊路线零工具零检索</text>
</svg>
