# ============================================================
# 劳小司 · 阿里云部署编排
#   PG(pgvector) 唯一持久层 + Redis 纯缓存 + 后端 JVM + 前端 nginx
# 使用：cp env.template .env 填值后 docker compose up -d --build
# 资源画像（2C2G）：JVM -Xmx1g + PG 共享缓冲 256MB + Redis 256MB + nginx，舒适区
# ============================================================
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: lab-pg
    restart: always
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    command: >
      postgres -c shared_buffers=256MB -c work_mem=8MB
      -c max_connections=100 -c effective_cache_size=512MB

  redis:
    image: redis:7-alpine
    container_name: lab-redis
    restart: always
    # noeviction：内存满拒绝写入而非驱逐（会话/配额/锁被静默驱逐极难排查）
    # appendonly：重启不丢缓存态（否则会话全断）
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy noeviction
      --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: lab-backend
    restart: always
    env_file: .env
    environment:
      # 容器内互联：覆盖 .env 里的本机地址
      PG_HOST: postgres
      PG_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8082"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: lab-frontend
    restart: always
    environment:
      API_UPSTREAM: http://backend:8082
    ports:
      # 若宿主机宝塔 nginx 占 80：改 8080:80 并由宝塔反代 8080，或停宝塔 nginx
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
  redis_data:
